spring.application.name=conectadoa-api
server.port=8080
springdoc.swagger-ui.path=/
api.version=v1

# Database - SQL Server local (Docker). A senha vem da variável de ambiente DB_PWD.
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=conectadoa;encrypt=false;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=${DB_PWD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

# Carga inicial das ONGs (data.sql) depois que o Hibernate cria as tabelas
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

server.forward-headers-strategy=framework
